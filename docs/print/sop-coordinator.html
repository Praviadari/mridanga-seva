<!doctype html>

<head>
<meta charset="utf-8">
<title>Mridanga Seva coordinator guide</title>
<!--
  Screen SOP, phase 2: the coordinator's screens. A4 portrait, printed to PDF with headless Edge or Chrome:
    msedge --headless --disable-gpu --no-pdf-header-footer --print-to-pdf=docs/print/sop-coordinator.pdf docs/print/sop-coordinator.html
  ALL wording lives in the TEXT block in the script at the end, so a Telugu or Hindi copy only replaces that block.
  Same renderer as sop-student.html; only IMG, COVER and MAP_IMG below the TEXT block differ.
  Screenshots: docs/print/sop-coordinator/*.jpg, taken on the TEST web version (made-up people), 390 x 844.
  A mark is [number, x, y] in the screenshot's own 390 x 844 pixels; the red circle is drawn at that point.
-->
<style>
  @page { size: A4; margin: 0; }
  :root { --night: #1B1E4B; --night2: #262A66; --gold: #E0B25C; --gold2: #F2CF86; --cream: #FBF4E6; --ink: #1d1f33;
          --muted: #555a7a; --green: #2E7D32; --red: #D7263D; --saffron: #9C4A06; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: "Segoe UI", "Nirmala UI", Arial, sans-serif; font-size: 10.5pt; line-height: 1.4; color: var(--ink);
         -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .page { width: 210mm; height: 297mm; padding: 11mm 13mm 0; position: relative; overflow: hidden; page-break-after: always; background: #fff; }
  .page:last-child { page-break-after: auto; }
  .serif { font-family: "Cambria", "Georgia", "Times New Roman", serif; }
  b, strong { color: #14163a; }
  .foot { position: absolute; left: 13mm; right: 13mm; bottom: 7mm; display: flex; justify-content: space-between;
          font-size: 8pt; color: var(--muted); border-top: 1px solid #e6dcc3; padding-top: 1.5mm; }

  /* workflow header band */
  .band { background: linear-gradient(135deg, var(--night), var(--night2)); color: #fff; border-radius: 4mm; padding: 4mm 6mm 3.6mm;
          position: relative; border-bottom: 1.2mm solid var(--gold); }
  .band .kick { color: var(--gold2); font-size: 8.5pt; letter-spacing: 1.6px; text-transform: uppercase; font-weight: 700; }
  .band h2 { margin: 0.6mm 0 0; font-size: 19pt; font-weight: 700; color: #fff; line-height: 1.15; }
  .band .who { margin-top: 1.4mm; font-size: 9.5pt; color: #e3e1f6; }
  .band .who b { color: var(--gold2); }
  .intro { margin: 3mm 1mm 0; font-size: 10.5pt; }

  /* phones */
  .phones { display: flex; justify-content: center; gap: 7mm; margin: 3.5mm 0 0; }
  .phones.two { gap: 16mm; }
  .shot { width: 50mm; display: flex; flex-direction: column; align-items: center; }
  .phone { width: 50mm; background: #121426; border-radius: 7mm; padding: 4.2mm 1.9mm 2.6mm; position: relative;
           box-shadow: 0 1.2mm 3mm rgba(20,22,58,.28); }
  .phone::before { content: ""; position: absolute; top: 1.5mm; left: 50%; width: 11mm; height: 1.4mm; margin-left: -5.5mm;
                   background: #2c2f4a; border-radius: 1mm; }
  .screen { position: relative; width: 100%; aspect-ratio: 390 / 844; }
  .screen img { display: block; width: 100%; height: 100%; object-fit: cover; border-radius: 3.4mm; }
  .mk { position: absolute; transform: translate(-50%, -50%); width: 6mm; height: 6mm; border-radius: 50%; background: var(--red);
        color: #fff; font-weight: 700; font-size: 9pt; line-height: 5.2mm; text-align: center; border: 0.45mm solid #fff;
        box-shadow: 0 0 0 0.5mm rgba(215,38,61,.35), 0 0.6mm 1.2mm rgba(0,0,0,.35); }
  .cap { margin-top: 1.8mm; font-size: 8.6pt; color: var(--muted); text-align: center; line-height: 1.3; min-height: 7mm; }
  .cap b { color: var(--ink); }

  /* drawn screen (no screenshot yet) */
  .drawn { position: absolute; inset: 0; border-radius: 3.4mm; overflow: hidden; background: #FBF4E6; font-size: 5.6pt; line-height: 1.35; }
  .drawn .top { background: linear-gradient(160deg, #1B1E4B, #2a2f74); color: var(--gold2); text-align: center; padding: 4mm 2mm 3.4mm; }
  .drawn .top .t { font-family: Cambria, Georgia, serif; font-size: 9pt; }
  .drawn .top .m { font-size: 5pt; color: #e8d6a6; }
  .drawn .card { background: #fffdf8; margin: 2mm 2mm 0; border-radius: 1.6mm; border-top: 0.6mm solid var(--gold); padding: 2mm 2.2mm;
                 box-shadow: 0 0.3mm 0.8mm rgba(0,0,0,.12); }
  .drawn h4 { margin: 0 0 1mm; font-family: Cambria, Georgia, serif; font-size: 8pt; color: #1d1f33; font-weight: 600; }
  .drawn .st { display: flex; gap: 1.4mm; margin: 1.1mm 0; align-items: flex-start; }
  .drawn .st i { flex: none; width: 3mm; height: 3mm; border-radius: 50%; font-style: normal; text-align: center; line-height: 3mm; font-size: 5pt; color: #fff; }
  .drawn .st i.done { background: var(--green); } .drawn .st i.now { background: var(--saffron); } .drawn .st i.todo { background: #fff; border: 0.3mm solid #b9a77f; }
  .drawn .btn { margin-top: 1.4mm; border-radius: 3mm; background: var(--saffron); color: #fff; text-align: center; padding: 1.2mm; font-weight: 700; }
  .drawn .row { display: flex; justify-content: space-between; border: 0.25mm solid #e3d6b8; border-radius: 1.2mm; padding: 1.2mm 1.6mm; margin-top: 1mm; }
  .drawn .row span { color: var(--muted); }
  .ribbon { position: absolute; left: 0; right: 0; bottom: 4mm; text-align: center; }
  .ribbon span { background: rgba(27,30,75,.88); color: #fff; font-size: 6.5pt; padding: 0.8mm 2mm; border-radius: 2mm; }

  /* a workflow: its screens in order, an arrow between them, the step under each */
  .flow { margin: 3mm 0 0; }
  .flow .frow { display: flex; justify-content: center; align-items: flex-start; }
  .flow .frow + .frow { margin-top: 2mm; }
  .flow .shot, .flow .phone { width: var(--pw); }
  .flow .cap { text-align: left; color: var(--ink); font-size: 8.6pt; line-height: 1.32; min-height: 0; margin-top: 1.6mm; }
  .arr { flex: none; width: 6.5mm; display: flex; align-items: center; justify-content: center; align-self: flex-start;
         height: calc(var(--pw) * 2.164 + 6mm); }
  .arr span { width: 5mm; height: 5mm; border-radius: 50%; background: var(--gold); color: var(--night); font-weight: 700;
              font-size: 9pt; line-height: 4.8mm; text-align: center; }
  .b { display: inline-block; width: 4.3mm; height: 4.3mm; border-radius: 50%; background: var(--red); color: #fff; font-weight: 700;
       font-size: 7pt; line-height: 4.3mm; text-align: center; margin: 0 0.6mm 0 0; vertical-align: 0.2mm; }
  .flow .mk { width: 5.2mm; height: 5.2mm; font-size: 8pt; line-height: 4.4mm; }
  .tip { margin: 3.4mm 1mm 0; background: var(--cream); border-left: 1.4mm solid var(--gold); padding: 2.2mm 3.4mm; border-radius: 0 2mm 2mm 0; font-size: 9.6pt; }
  .trouble { margin: 3mm 1mm 0; background: #fdf0ee; border-left: 1.4mm solid var(--red); padding: 2.2mm 3.4mm; border-radius: 0 2mm 2mm 0; font-size: 9.4pt; }
  .trouble h3, .tip h3 { margin: 0 0 0.8mm; font-size: 10pt; color: #8e1b2b; }
  .tip h3 { color: #7a5200; }
  .trouble ul { margin: 0; padding-left: 4.5mm; } .trouble li { margin: 0.5mm 0; }

  /* cover */
  .cover { background: radial-gradient(ellipse at 50% 18%, #3a3f8f 0%, var(--night2) 38%, var(--night) 75%); color: #fff; padding: 0; }
  .cover .inner { padding: 22mm 18mm 0; text-align: center; }
  .cover .logo { width: 30mm; height: 30mm; border-radius: 50%; background: var(--cream); display: inline-flex; align-items: center; justify-content: center;
                 box-shadow: 0 0 0 1.2mm rgba(224,178,92,.55); }
  .cover .logo img { width: 30mm; height: 30mm; border-radius: 50%; }
  .cover .app { margin-top: 5mm; font-size: 30pt; color: var(--gold2); }
  .cover .motto { color: #f0d9a4; letter-spacing: 1px; font-size: 11pt; }
  .cover .rule { width: 60mm; height: 0.5mm; background: var(--gold); margin: 6mm auto; opacity: .8; }
  .cover h1 { font-size: 27pt; margin: 0; color: #fff; }
  .cover .sub { margin-top: 2.5mm; font-size: 13pt; color: #e3e1f6; }
  .cover .phones { margin-top: 12mm; gap: 6mm; }
  .cover .phone { box-shadow: 0 2mm 6mm rgba(0,0,0,.45); }
  .cover .note { position: absolute; left: 18mm; right: 18mm; bottom: 12mm; font-size: 9pt; color: #c9c6e6; text-align: center; line-height: 1.5; }

  /* contents, map, help */
  h2.plain { font-size: 18pt; color: var(--night); margin: 0 0 3mm; padding-bottom: 1.6mm; border-bottom: 0.9mm solid var(--gold); }
  .toc { list-style: none; margin: 0; padding: 0; }
  .toc li { display: flex; align-items: baseline; gap: 2mm; padding: 1.1mm 0; border-bottom: 1px dotted #d9ccad; font-size: 11pt; }
  .toc li .no { width: 8mm; color: var(--saffron); font-weight: 700; }
  .toc li .t { flex: 1; } .toc li .who { color: var(--muted); font-size: 9pt; } .toc li .pg { width: 10mm; text-align: right; font-weight: 700; color: var(--night); }
  .how { display: grid; grid-template-columns: 1fr 1fr; gap: 3mm 6mm; margin-top: 4mm; }
  .how .box { background: var(--cream); border-radius: 2.5mm; padding: 2.6mm 3.4mm; font-size: 9.6pt; }
  .how .box h3 { margin: 0 0 1mm; font-size: 10.5pt; color: var(--night); }
  .map { display: flex; gap: 8mm; margin-top: 3mm; align-items: flex-start; }
  .map .phone { width: 66mm; flex: none; }
  table.keys { border-collapse: collapse; width: 100%; font-size: 9.4pt; }
  table.keys td { border-bottom: 1px solid #e6dcc3; padding: 1.5mm 1.2mm; vertical-align: top; }
  table.keys td.k { width: 8mm; } table.keys td.p { width: 13mm; text-align: right; color: var(--night); font-weight: 700; white-space: nowrap; }
  table.keys .n { display: inline-block; width: 6mm; height: 6mm; border-radius: 50%; background: var(--red); color: #fff; font-weight: 700; font-size: 9pt; line-height: 6mm; text-align: center; }
  table.help { border-collapse: collapse; width: 100%; font-size: 9.8pt; margin-top: 2mm; }
  table.help th { background: var(--night); color: #fff; text-align: left; padding: 1.8mm 2.4mm; }
  table.help td { border-bottom: 1px solid #e6dcc3; padding: 1.8mm 2.4mm; vertical-align: top; }
  table.help tr:nth-child(even) td { background: #fbf8f1; }
</style>
</head>

/* ======================================================================
   Renderer: builds the pages from TEXT. No wording below this line.
   ====================================================================== */
const IMG = "sop-coordinator/";
const COVER = ["home", "checkin", "desk"];   /* the three phones on the cover */
const MAP_IMG = "home";                       /* the screen on the map page */
const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const pageOf = {};
let pageNo = 0;
const md = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\{(\w+)\}/g, (m, id) => pageOf[id] || "?")
  .replace(/\[(\d+)\]/g, '<span class="b">$1</span>');

/* a mark near the left edge (x <= 45) moves onto the phone's rim, so it points at the row without hiding its words */
function marksHtml(marks) {
  return (marks || []).map(([n, x, y]) =>
    `<span class="mk" style="left:${((x <= 45 ? -9 : x) / 390 * 100).toFixed(2)}%;top:${(y / 844 * 100).toFixed(2)}%">${n}</span>`).join("");
}
function drawnWaiting(k) {
  const w = TEXT.waitingDrawing;
  return `<div class="drawn"><div style="transform:scale(${k});transform-origin:0 0;width:${100 / k}%;height:${100 / k}%;position:relative"><div class="top"><div class="t">${esc(TEXT.cover.app)}</div><div class="m">${esc(TEXT.cover.motto)}</div></div>
    <div class="card"><h4>${esc(w.title)}</h4><div>${esc(w.body)}</div>
      ${w.steps.map(([k, sym, t]) => `<div class="st"><i class="${k}">${sym}</i><div>${esc(t)}</div></div>`).join("")}
      <div class="btn">${esc(w.check)}</div></div>
    <div class="card"><h4>${esc(w.waitTitle)}</h4><div>${esc(w.waitBody)}</div>
      ${w.rows.map(([a, b]) => `<div class="row"><div><b>${esc(a)}</b><br><span>${esc(b)}</span></div><div>›</div></div>`).join("")}</div>
    <div class="ribbon"><span>${esc(w.ribbon)}</span></div></div></div>`;
}
function phoneHtml(shot, cls, pw) {
  const inner = shot.drawn ? drawnWaiting((pw || 50) / 50) : `<img src="${IMG}${shot.img}.jpg" alt="">`;
  return `<div class="shot"${cls ? ` style="${cls}"` : ""}><div class="phone"><div class="screen">${inner}${marksHtml(shot.marks)}</div></div>` +
         (shot.cap !== undefined ? `<div class="cap">${md(shot.cap)}</div>` : "") + `</div>`;
}
/* up to 4 screens in one row; 5 or 6 in rows of 3. Phone width: 3 → 54 mm, 4 → 42 mm, 5-6 → 40 mm */
function flowHtml(shots) {
  const n = shots.length, pw = n <= 3 ? 54 : n === 4 ? 42 : 40;
  const rows = n <= 4 ? [shots] : [shots.slice(0, 3), shots.slice(3)];
  return `<div class="flow" style="--pw:${pw}mm">` + rows.map((row) =>
    `<div class="frow">${row.map((s) => phoneHtml(s, "", pw)).join(`<div class="arr"><span>›</span></div>`)}</div>`).join("") + `</div>`;
}
function foot() { return `<div class="foot"><span>${esc(TEXT.foot)}</span><span>${esc(TEXT.pageWord)} ${pageNo}</span></div>`; }

/* page numbers first, so {id} references resolve */
const order = ["cover", "contents", "map", ...TEXT.workflows.map((w) => w.id), "help"];
order.forEach((id, i) => { pageOf[id] = i + 1; });

const out = [];
/* cover */
pageNo = 1;
out.push(`<section class="page cover"><div class="inner">
  <div class="logo"><img src="${IMG}app-icon.png" alt=""></div>
  <div class="app serif">${esc(TEXT.cover.app)}</div><div class="motto">${esc(TEXT.cover.motto)}</div>
  <div class="rule"></div><h1 class="serif">${esc(TEXT.cover.title)}</h1><div class="sub">${esc(TEXT.cover.sub)}</div>
  <div class="phones">${COVER.map((img) => phoneHtml({ img })).join("")}</div></div>
  <div class="note">${esc(TEXT.cover.note)}</div></section>`);

/* contents */
pageNo = 2;
const tocRows = [["", TEXT.map.title, TEXT.map.who, pageOf.map],
  ...TEXT.workflows.map((w, i) => [String(i + 1), w.title, w.who, pageOf[w.id]]), ["", TEXT.help.title, "", pageOf.help]];
out.push(`<section class="page"><h2 class="plain serif">${esc(TEXT.contents.title)}</h2>
  <ul class="toc">${tocRows.map(([n, t, who, p]) => `<li><span class="no">${n}</span><span class="t">${esc(t)}</span><span class="pg">${p}</span></li>`).join("")}</ul>
  <h2 class="plain serif" style="margin-top:6mm">${esc(TEXT.contents.howTitle)}</h2>
  <div class="how">${TEXT.contents.how.map(([h, b]) => `<div class="box"><h3>${esc(h)}</h3>${md(b)}</div>`).join("")}</div>${foot()}</section>`);

/* map */
pageNo = 3;
const m = TEXT.map;
out.push(`<section class="page"><div class="band"><div class="kick">${esc(m.kick)}</div><h2 class="serif">${esc(m.title)}</h2><div class="who">${esc(m.who)}</div></div>
  <p class="intro">${md(m.intro)}</p>
  <div class="map"><div>${phoneHtml({ img: MAP_IMG, marks: m.marks, cap: m.cap }, "width:66mm")}</div>
  <table class="keys">${m.keys.map(([n, t, ids]) => `<tr><td class="k"><span class="n">${n}</span></td><td>${md(t)}</td><td class="p">${ids.map((id) => pageOf[id]).join(", ")}</td></tr>`).join("")}</table></div>
  <div class="tip">${md(m.note)}</div>${foot()}</section>`);

/* workflows */
TEXT.workflows.forEach((w, i) => {
  pageNo = pageOf[w.id];
  out.push(`<section class="page"><div class="band"><div class="kick">${i + 1} · ${esc(w.kick)}</div><h2 class="serif">${esc(w.title)}</h2>
    <div class="who"><b>${esc(TEXT.forWord)}</b> ${esc(w.who)}</div></div>
    <p class="intro">${md(w.intro)}</p>
    ${flowHtml(w.shots)}
    ${w.tip ? `<div class="tip">${md(w.tip)}</div>` : ""}
    <div class="trouble"><h3>${esc(TEXT.troubleTitle)}</h3><ul>${w.trouble.map((t) => `<li>${md(t)}</li>`).join("")}</ul></div>
    ${foot()}</section>`);
});

/* help */
pageNo = pageOf.help;
const h = TEXT.help;
out.push(`<section class="page"><div class="band"><div class="kick">${esc(TEXT.docTitle)}</div><h2 class="serif">${esc(h.title)}</h2></div>
  <p class="intro">${md(h.intro)}</p>
  <table class="help"><tr><th>${esc(h.head[0])}</th><th>${esc(h.head[1])}</th></tr>
  ${h.rows.map(([a, b]) => `<tr><td>${md(a)}</td><td>${md(b)}</td></tr>`).join("")}</table>
  <div class="tip" style="margin-top:5mm">${md(h.contact)}</div>${foot()}</section>`);

document.getElementById("doc").innerHTML = out.join("\n");
document.title = TEXT.cover.app + " " + TEXT.docTitle.toLowerCase();
</script>
