# Dependabot opens pull requests for outdated or vulnerable packages (audit D11-16). CI checks each
# one; a maintainer reviews and merges by hand. Never auto-merge: an app package can change the
# APK fingerprint (docs/OPERATIONS.md "Dependabot"). Expo packages are updated with
# `npx expo install --fix` for an SDK upgrade, so their major versions are left to that.
version: 2
updates:
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      app-minor-and-patch:
        update-types: [minor, patch]
    # Expo SDK 57 pins these to exact versions; any bump (even a patch) changes the fingerprint and
    # needs a new APK. They move only together, with `npx expo install --fix` at an SDK upgrade
    # (lead decision 07-10-2026, after PR #5 bumped react and four native modules).
    ignore:
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@react-native/*"
      - dependency-name: "@types/react"
      # eas-cli is pinned on purpose (DECISIONS #153); raise it by hand.
      - dependency-name: "eas-cli"
      # The Expo SDK sets the TypeScript and ESLint majors it supports.
      - dependency-name: "typescript"
        update-types: [version-update:semver-major]
      - dependency-name: "eslint"
        update-types: [version-update:semver-major]
      - dependency-name: "eslint-config-expo"
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /supabase/tests
    schedule:
      interval: weekly
      day: monday
    groups:
      db-tests-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
      day: monday
    groups:
      website-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        update-types: [minor, patch]
