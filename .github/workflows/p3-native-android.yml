# BRANCH p3-native ONLY (Phase 3 P3-3 native foundation + P3-4 enrolment; docs/DECISIONS.md #307).
# A free compile check of the Phase 3 APK on GitHub's runner, so a native build failure shows up here and
# not in one of the few free EAS builds: the same steps EAS runs (expo prebuild, then a release Gradle build,
# minified, both phone ABIs), plus the APK's size against the APK without the face packages (origin/weekend-app
# 421980f = Friday's APK code) and the permissions the APK asks for. No secrets and no server settings: the
# app is built without Supabase values (it would only show "App not set up"), and the APK it keeps is signed
# with the debug key, for reading only — never installed for the class. Actions pinned by commit SHA like ci.yml.
# Results are written as annotations, readable without a GitHub login:
#   https://api.github.com/repos/Praviadari/mridanga-seva/actions/runs/<run>/jobs → check-runs/<job id>/annotations
name: Phase 3 APK (p3-native)

on:
  push:
    branches: [p3-native]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p3-native-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Prebuild + Gradle release build
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Lint, types, unit tests
        run: |
          npx expo lint --no-cache
          node scripts/typed-routes.mjs
          npx tsc --noEmit
          npm test
      - name: Fingerprint (runtime version)
        run: |
          FP=$(npx expo-updates runtimeversion:resolve --platform android | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).runtimeVersion))") || FP=unknown
          echo "::notice title=Fingerprint (android runtime version)::$FP"
      - name: Expo prebuild (android)
        run: npx expo prebuild -p android --no-install
      - name: Gradle assembleRelease
        working-directory: app/android
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx6g
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease --no-daemon --stacktrace -PreactNativeArchitectures=arm64-v8a,armeabi-v7a 2>&1 | tee ../gradle.log
      - name: Report a Gradle failure as annotations
        if: failure()
        run: |
          esc() { sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}'; }
          echo "::error title=Gradle: what went wrong::$(grep -n -A 12 'What went wrong' gradle.log | head -60 | esc)"
          echo "::error title=Gradle: error lines::$(grep -n -E 'error:|e: |FAILED|Could not|CMake Error|undefined reference' gradle.log | head -40 | esc)"
          echo "::error title=Gradle: last lines::$(tail -40 gradle.log | esc)"
      - name: APK size, contents and permissions
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          ls -l "$APK"
          unzip -lv "$APK" > apk-list.txt
          sort -k1 -n -r apk-list.txt | head -40
          esc() { sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}'; }
          echo "::notice title=APK size (bytes)::$(stat -c %s "$APK")"
          echo "::notice title=arm64 libs (compressed bytes, name)::$(grep -E 'lib/arm64-v8a/' apk-list.txt | awk '{print $3, $8}' | sort -n -r | head -45 | esc)"
          echo "::notice title=models, bundle, dex (size, compressed, name)::$(grep -E '\.tflite|index.android.bundle|classes[0-9]*\.dex' apk-list.txt | awk '{print $1, $3, $8}' | esc)"
          if grep -q 'libtensorflowlite_gpu_jni.so' apk-list.txt; then echo "::warning title=GPU delegate::libtensorflowlite_gpu_jni.so is still in the APK"; else echo "::notice title=GPU delegate::left out (as planned)"; fi
          if grep -q 'libsqlcipher\|lib/arm64-v8a/libcrypto.so' apk-list.txt; then echo "::warning title=SQLCipher::an SQLCipher library is in the APK"; else echo "::notice title=SQLCipher::not in the APK (as planned)"; fi
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          echo "::notice title=Permissions the APK asks for::$("$AAPT" dump permissions "$APK" | esc)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: p3-native-apk-debug-signed
          path: app/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14

  # The same release build of origin/weekend-app 421980f (p3-native's base, no face packages), only to measure
  # how much the face packages and models add. Runs in parallel; keeps no artifact.
  baseline:
    name: Baseline APK size (weekend-app 421980f, no face packages)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: 421980f33884a345464c59e87e4abbc32482b2ed # origin/weekend-app 421980f
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx expo prebuild -p android --no-install
      - name: Gradle assembleRelease
        working-directory: app/android
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx6g
        run: ./gradlew :app:assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      - name: APK size
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          unzip -lv "$APK" > apk-list.txt
          esc() { sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}'; }
          echo "::notice title=BASELINE APK size (bytes)::$(stat -c %s "$APK")"
          echo "::notice title=BASELINE arm64 libs (compressed bytes, name)::$(grep -E 'lib/arm64-v8a/' apk-list.txt | awk '{print $3, $8}' | sort -n -r | head -45 | esc)"
