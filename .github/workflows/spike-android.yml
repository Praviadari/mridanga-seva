# BRANCH p3-spike ONLY — NEVER MERGE (Phase 3 P3-0 face spike, docs/phase3/SPIKE_RESULT.md).
# Compiles the spike APK (org.mridangaseva.app.spike, "Mridanga Seva SPIKE") on GitHub's free runner, so a
# native build failure shows up here and not in one of the few free EAS builds. Same steps EAS runs:
# expo prebuild, then a release Gradle build (minified, both phone ABIs). No secrets, no server settings.
# The APK it keeps is signed with the debug key (fine for a throwaway test app); the EAS "spike" profile
# signs with its own key. Actions pinned by commit SHA like ci.yml.
name: Spike APK (p3-spike)

on:
  push:
    branches: [p3-spike]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spike-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Prebuild + Gradle release build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Lint, types, unit tests
        run: |
          npx expo lint --no-cache
          node scripts/typed-routes.mjs
          npx tsc --noEmit
          npm test
      - name: Expo prebuild (android)
        run: npx expo prebuild -p android --no-install
      - name: Tool versions
        run: |
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/ndk" || true
      - name: Gradle assembleRelease
        working-directory: app/android
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx6g
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      - name: APK size and what is inside
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          ls -l "$APK"
          echo "--- largest entries (bytes uncompressed) ---"
          unzip -lv "$APK" | sort -k1 -n -r | head -40
          echo "--- native libraries per ABI ---"
          unzip -lv "$APK" | grep -E 'lib/(arm64-v8a|armeabi-v7a)/' | awk '{print $1, $3, $8}' | sort -k3
          echo "--- models ---"
          unzip -lv "$APK" | grep -i tflite || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: face-spike-apk
          path: app/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
