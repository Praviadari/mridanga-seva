# BRANCH p3-spike ONLY — NEVER MERGE (Phase 3 P3-0 face spike, docs/phase3/SPIKE_RESULT.md).
# Compiles the spike APK (org.mridangaseva.app.spike, "Mridanga Seva SPIKE") on GitHub's free runner, so a
# native build failure shows up here and not in one of the few free EAS builds. Same steps EAS runs:
# expo prebuild, then a release Gradle build (minified, both phone ABIs). No secrets, no server settings.
# The APK it keeps is signed with the debug key (fine for a throwaway test app); the EAS "spike" profile
# signs with its own key. Actions pinned by commit SHA like ci.yml.
name: Spike APK (p3-spike)

on:
  push:
    branches: [p3-spike]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spike-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Prebuild + Gradle release build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Lint, types, unit tests
        run: |
          npx expo lint --no-cache
          node scripts/typed-routes.mjs
          npx tsc --noEmit
          npm test
      - name: Expo prebuild (android)
        run: npx expo prebuild -p android --no-install
      - name: Tool versions
        run: |
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/ndk" || true
      - name: Gradle assembleRelease
        working-directory: app/android
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx6g
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease --no-daemon --stacktrace -PreactNativeArchitectures=arm64-v8a,armeabi-v7a 2>&1 | tee ../gradle.log
      # Run logs need a GitHub login; annotations do not (check-runs API), so the spike chat can read
      # the reason for a failure and the APK sizes without signing in.
      - name: Report a Gradle failure as annotations
        if: failure()
        run: |
          esc() { sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}'; }
          echo "::error title=Gradle: what went wrong::$(grep -n -A 12 'What went wrong' gradle.log | head -60 | esc)"
          echo "::error title=Gradle: error lines::$(grep -n -E 'error:|e: |FAILED|Could not|CMake Error|undefined reference' gradle.log | head -40 | esc)"
          echo "::error title=Gradle: last lines::$(tail -40 gradle.log | esc)"
      - name: APK size and what is inside
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          ls -l "$APK"
          unzip -lv "$APK" > apk-list.txt
          echo "--- largest entries (bytes uncompressed) ---"
          sort -k1 -n -r apk-list.txt | head -40
          echo "--- native libraries per ABI ---"
          grep -E 'lib/(arm64-v8a|armeabi-v7a)/' apk-list.txt | awk '{print $1, $3, $8}' | sort -k3
          echo "--- models ---"
          grep -i tflite apk-list.txt || true
          esc() { sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}'; }
          echo "::notice title=APK size (bytes)::$(stat -c %s "$APK")"
          echo "::notice title=arm64 libs (compressed bytes, name)::$(grep -E 'lib/arm64-v8a/' apk-list.txt | awk '{print $3, $8}' | sort -n -r | head -45 | esc)"
          echo "::notice title=models, bundle, dex (size, compressed, name)::$(grep -E '\.tflite|index.android.bundle|classes[0-9]*\.dex' apk-list.txt | awk '{print $1, $3, $8}' | esc)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: face-spike-apk
          path: app/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7

  # The same release build of brief9-apk 3a5dcc0 (the spike's base, no face packages), only to measure how much
  # the face packages and models add to the APK. Runs in parallel; keeps no artifact.
  baseline:
    name: Baseline APK size (brief9-apk, no face packages)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: 3a5dcc0c83c80be4f45fd93f4a2681ef460960c6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx expo prebuild -p android --no-install
      - name: Gradle assembleRelease
        working-directory: app/android
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx6g
        run: ./gradlew :app:assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      - name: APK size
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          unzip -lv "$APK" > apk-list.txt
          esc() { sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}'; }
          echo "::notice title=BASELINE APK size (bytes)::$(stat -c %s "$APK")"
          echo "::notice title=BASELINE arm64 libs (compressed bytes, name)::$(grep -E 'lib/arm64-v8a/' apk-list.txt | awk '{print $3, $8}' | sort -n -r | head -45 | esc)"
          echo "::notice title=BASELINE bundle, dex (size, compressed, name)::$(grep -E 'index.android.bundle|classes[0-9]*\.dex' apk-list.txt | awk '{print $1, $3, $8}' | esc)"